name: Build flower wallpaper

on:
  schedule:
    - cron: "0 9 * * *"       # 09:00 UTC daily — ~5am Eastern
  workflow_dispatch:           # the "Run workflow" button in the Actions tab
    inputs:
      dry_run:
        description: "Pick flowers only — no images drawn, nothing charged"
        type: boolean
        default: false
      redraw:
        description: "Redraw ALL flowers from scratch (costs ~4c each)"
        type: boolean
        default: false
      sample:
        description: "Draw only this many flowers, to check the style (0 = all)"
        type: string
        default: "0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Clear existing flowers
        if: ${{ inputs.redraw == true }}
        run: rm -rf flowers && echo "flowers cleared — all will be redrawn"

      - name: Build wallpaper
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python run.py --dry-run
          else
            python run.py --sample "${{ inputs.sample || 0 }}"
          fi

      - name: Commit new flowers and wallpaper
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  "flower-bot"
          git config user.email "flower-bot@users.noreply.github.com"
          git add -A flowers wallpaper.png
          git diff --staged --quiet || git commit -m "garden: $(date -u +%Y-%m-%d)"
          git push
